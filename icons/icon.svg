<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Pearl gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="50%" stop-color="#F7F3EC"/>
      <stop offset="100%" stop-color="#EEE8DE"/>
    </linearGradient>
    <!-- Glass disc gradient -->
    <radialGradient id="glass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </radialGradient>
    <!-- Squircle clip path -->
    <clipPath id="squircle">
      <path d="M 256 0 C 460 0 512 52 512 256 C 512 460 460 512 256 512 C 52 512 0 460 0 256 C 0 52 52 0 256 0 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Glass disc -->
    <circle cx="256" cy="246" r="174" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>
    <circle cx="256" cy="246" r="162" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- 12 tick marks -->
    <g stroke="#443C34" stroke-linecap="round">
      <!-- Major: 12, 3, 6, 9 -->
      <line x1="256" y1="120" x2="256" y2="100" stroke-width="7" opacity="0.85"/>
      <line x1="382" y1="246" x2="402" y2="246" stroke-width="7" opacity="0.85"/>
      <line x1="256" y1="372" x2="256" y2="392" stroke-width="7" opacity="0.85"/>
      <line x1="130" y1="246" x2="110" y2="246" stroke-width="7" opacity="0.85"/>
      <!-- Minor: 1,2,4,5,7,8,10,11 -->
      <line x1="319" y1="137" x2="329" y2="119" stroke-width="4" opacity="0.6"/>
      <line x1="365" y1="183" x2="383" y2="173" stroke-width="4" opacity="0.6"/>
      <line x1="365" y1="309" x2="383" y2="319" stroke-width="4" opacity="0.6"/>
      <line x1="319" y1="355" x2="329" y2="373" stroke-width="4" opacity="0.6"/>
      <line x1="193" y1="355" x2="183" y2="373" stroke-width="4" opacity="0.6"/>
      <line x1="147" y1="309" x2="129" y2="319" stroke-width="4" opacity="0.6"/>
      <line x1="147" y1="183" x2="129" y2="173" stroke-width="4" opacity="0.6"/>
      <line x1="193" y1="137" x2="183" y2="119" stroke-width="4" opacity="0.6"/>
    </g>

    <!-- Center checkmark -->
    <path d="M 195 256 L 240 300 L 320 210"
          fill="none" stroke="#443C34" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
